[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commerce-creative-workflow-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.18.5",
  "argon2-cffi==25.1.0",
  "cos-python-sdk-v5==1.9.44",
  "dramatiq[redis]==1.18.0",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "pillow==12.3.0",
  "prometheus-client==0.25.0",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.14.2",
  "python-multipart==0.0.32",
  "redis==6.4.0",
  "sqlalchemy==2.0.51",
  "structlog==25.5.0",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.22.1",
  "pytest==8.4.2",
  "pytest-cov==6.3.0",
  "ruff==0.15.22",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
