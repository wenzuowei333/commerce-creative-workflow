server {
    listen 80;
    server_name _;

    client_max_body_size 24m;

    location = /image-studio {
        return 301 /image-studio/;
    }

    location /image-studio/api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /image-studio;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /image-studio/health/ {
        proxy_pass http://api:8000/health/;
        proxy_set_header Host $host;
    }

    location /image-studio/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /image-studio/index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ~* ^/image-studio/assets/.+\.(js|css|png|jpg|jpeg|webp|woff2)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }
}
